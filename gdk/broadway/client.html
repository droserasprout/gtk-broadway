<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>brotway</title>
<script>
/* Restore the last app tab title + favicon synchronously, so a page reload keeps
 * them instead of blinking back to the default until the Broadway session
 * reconnects. broadway.js keeps these in sessionStorage (favicon as a data: URL,
 * since blob: URLs don't survive navigation). */
(function () {
    try {
        var t = sessionStorage.getItem("brotwayTabTitle");
        if (t) document.title = t;
        var ic = sessionStorage.getItem("brotwayTabIcon");
        if (ic) {
            var l = document.createElement("link");
            l.rel = "icon";
            l.href = ic;
            document.head.appendChild(l);
        }
    } catch (e) {}
})();
</script>
<style type="text/css">
/* touch-action: none stops the browser from claiming touch sequences for
 * scroll/zoom (GTK handles those) and firing touchcancel mid-gesture. It is NOT
 * inherited, and mobile browsers (Gecko APZ + Chrome compositor) key off the
 * *touched* element, so body alone doesn't cover the dynamically-created surface
 * divs, so a 2nd finger on a list element then lets the compositor hijack or
 * cancel the touch and leak a tap. Apply it to every element so no touched node
 * is left with the default. */
html, body { overflow: hidden; touch-action: none; }
/* Fill the area not painted by a GTK surface (page load, disconnect, and the
 * margins around a zoomed-out surface) with a theme-ish background instead of
 * white. Follows the browser's light/dark preference; dark matches the GTK
 * default theme's window background (~#242424), light its ~#fafafa. */
html, body { background: #fafafa; }
@media (prefers-color-scheme: dark) {
  html, body { background: #242424; }
}
* { touch-action: none; }
/* Wrapper holding all toplevel surfaces; touch pinch-zoom magnifies it via a
 * CSS transform (see zoom handling in broadway.js). transform-origin 0 0 keeps
 * surface root coordinates a simple divide-by-zoom from page coordinates. */
#zoomRoot { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
<script type="text/javascript" src="broadway.js"></script>
</head>

<body onload="connect()" onclick="if (!document.hasFocus() && window.topElement !== window.self) { window.focus(); }">
<div id="zoomRoot"></div>
</body>
</html>
