# Build the Broadway clipboard/touch fork as Debian packages (amd64 + arm64) and
# publish them to a rolling GitHub Release
#
# Each arch builds natively (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm) in
# a clean `container: ubuntu:26.04` (NOT the bare runner) so the binaries stay
# ABI-compatible with apt's GTK.
#
# The .deb (package gtk4-broadway-fork) ships and apt-installs, per arch:
#
#   - /usr/lib/<multiarch>/libgtk-4.so.1.2200.2       (GDK broadway: clipboard + touch)
#   - /usr/lib/<multiarch>/libgtk-4.so.1 -> ...2200.2 (repoints the SONAME link)
#   - /usr/bin/gtk4-broadwayd                         (daemon w/ embedded broadway.js)
#
# It Depends on + Replaces libgtk-4-1 and libgtk-4-bin, so apt takes over just
# those files while the rest of apt's GTK (gir, common, ...) stays in place.
name: Build Broadway GTK .deb

on:
  push:
    branches: [4.22.2-fork]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  RELEASE_TAG: 4.22.2-latest
  GTK_VERSION: "4.22.2"
  SO_NAME: libgtk-4.so.1.2200.2
  RUNTIME_PKGS: "libgtk-4-1, libgtk-4-bin"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      ARCH: ${{ matrix.arch }}
      MULTIARCH: ${{ matrix.multiarch }}
      DEB_FILE: libgtk4-broadway-fork_${{ matrix.arch }}.deb
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "1G"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ccache meson ninja-build pkg-config gettext python3 git ca-certificates zstd \
            libglib2.0-dev libglib2.0-dev-bin libgraphene-1.0-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libepoxy-dev libxkbcommon-dev libfribidi-dev libharfbuzz-dev \
            libjpeg-dev libpng-dev libtiff-dev libdrm-dev

      - uses: actions/checkout@v4

      # ccache persists across runs so unchanged .c files relink without recompiling.
      # rm -rf _build wipes the build dir, but ccache keys on preprocessed source, so
      # its hits survive the from-scratch meson reconfigure. Keyed per arch; the SHA
      # suffix + prefix restore-keys give each run the latest cache and save a new one.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Build (broadway-only)
        run: |
          ccache --zero-stats
          rm -rf _build
          # meson auto-detects ccache in PATH and uses it as the compiler launcher.
          meson setup _build \
            -Dbroadway-backend=true \
            -Dx11-backend=false -Dwayland-backend=false -Dwin32-backend=false -Dmacos-backend=false \
            -Dvulkan=disabled -Dintrospection=disabled -Ddocumentation=false -Dman-pages=false \
            -Dbuild-testsuite=false -Dbuild-tests=false -Dbuild-examples=false -Dbuild-demos=false \
            -Dmedia-gstreamer=disabled -Dprint-cups=disabled \
            -Dbuildtype=release
          ninja -C _build
          ccache --show-stats

      - name: Assemble .deb
        run: |
          DEB_VERSION="${GTK_VERSION}+broadwayfork.${GITHUB_RUN_NUMBER}"
          rm -rf pkgroot
          install -d pkgroot/DEBIAN "pkgroot/usr/lib/${MULTIARCH}" pkgroot/usr/bin
          install -m644 "_build/gtk/${SO_NAME}" "pkgroot/usr/lib/${MULTIARCH}/${SO_NAME}"
          ln -sf "${SO_NAME}" "pkgroot/usr/lib/${MULTIARCH}/libgtk-4.so.1"
          install -m755 _build/gdk/broadway/gtk4-broadwayd pkgroot/usr/bin/gtk4-broadwayd
          cat > pkgroot/DEBIAN/control <<EOF
          Package: gtk4-broadway-fork
          Version: ${DEB_VERSION}
          Architecture: ${ARCH}
          Maintainer: Lev Gorodetskii <github@drsr.io>
          Section: libs
          Priority: optional
          Homepage: https://github.com/droserasprout/gtk-broadway
          Depends: ${RUNTIME_PKGS}
          Replaces: ${RUNTIME_PKGS}
          Description: GTK ${GTK_VERSION} Broadway backend (clipboard + touch fork)
           Patched libgtk-4 shared object plus the gtk4-broadwayd daemon for the
           Broadway backend, adding bi-directional clipboard and touch/Android input
           fixes and repointing the libgtk-4.so.1 SONAME link at them. Overlays
           libgtk-4-1 / libgtk-4-bin (Depends + Replaces), leaving the rest of apt's
           GTK (gir, common, ...) untouched.
          EOF
          printf '#!/bin/sh\nset -e\nldconfig\n' > pkgroot/DEBIAN/postinst
          chmod 755 pkgroot/DEBIAN/postinst
          dpkg-deb --root-owner-group --build pkgroot "${DEB_FILE}"
          dpkg-deb --info "${DEB_FILE}"
          dpkg-deb --contents "${DEB_FILE}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Publish to the rolling '${{ env.RELEASE_TAG }}' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l ./*.deb
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --prerelease --title "GTK ${GTK_VERSION} Broadway (rolling)" \
                 --notes "Patched GTK ${GTK_VERSION} Broadway backend. Rolling build; amd64/arm64 assets are overwritten on every push to ${GTK_VERSION}-fork." \
                 --target "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" ./*.deb --repo "$GITHUB_REPOSITORY" --clobber
          for f in ./*.deb; do
            echo "Published https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$f")"
          done
