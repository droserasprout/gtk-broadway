# Build the Broadway clipboard/touch fork for every supported GTK base and collect
# all artifacts into ONE immutable GitHub Release. Lives on the orphan `ci` branch.
#
# On a vN tag, each base is built from its PINNED per-version tag <gtk>-N (which must
# be created manually first), and all four artifacts (2 bases x 2 arches) are
# published, per base x arch, as:
#   gtk4-broadway-fork_<gtk>-<N>_<arch>.deb     (e.g. ..._4.22.2-123_amd64.deb)
#
# Cutting v123:
#   git tag 4.14.5-123 <commit> && git push origin 4.14.5-123
#   git tag 4.22.2-123 <commit> && git push origin 4.22.2-123
#   git tag v123 ci             && git push origin v123
name: Release Broadway GTK .debs

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.rev.outputs.rev }}        # "123" for tag v123
    steps:
      - id: rev
        run: echo "rev=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        target:
          - { gtk: "4.14.5", container: "ubuntu:24.04", demos: "-Ddemos=false" }
          - { gtk: "4.22.2", container: "ubuntu:26.04", demos: "-Dbuild-demos=false" }
    # Build the pinned per-version tag <gtk>-N. A missing tag fails checkout in
    # build.yml, so the release does not publish.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ format('{0}-{1}', matrix.target.gtk, needs.setup.outputs.rev) }}
      gtk: ${{ matrix.target.gtk }}
      container: ${{ matrix.target.container }}
      demos: ${{ matrix.target.demos }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Publish ${{ github.ref_name }} release
        run: |
          set -eux
          ls -l ./*.deb
          TAG="${GITHUB_REF_NAME}"; REV="${TAG#v}"
          # Version-stamp the per-base/arch names for this immutable release.
          mkdir -p versioned
          for f in ./*.deb; do
            b="$(basename "${f%.deb}")"      # gtk4-broadway-fork_<gtk>_<arch>
            arch="${b##*_}"; rest="${b%_*}"  # <arch> ; gtk4-broadway-fork_<gtk>
            cp "$f" "versioned/${rest}-${REV}_${arch}.deb"
          done
          ls -l ./versioned/*.deb
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Broadway GTK fork ${TAG}" \
                 --notes "Multi-base (4.14.5, 4.22.2) multi-arch (amd64, arm64) Broadway GTK fork, revision ${REV}."
          gh release upload "$TAG" ./versioned/*.deb --repo "$GITHUB_REPOSITORY" --clobber
