# Reusable build: compile broadway-only GTK for ONE base (gtk version) across
# amd64 + arm64, assemble the .deb, and upload it as a WORKFLOW ARTIFACT. No
# GitHub Release publishing happens here - callers handle that, if at all.
#
# Each arch builds natively (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm)
# inside `container:` (the matching Ubuntu) so the binary stays ABI-compatible
# with that Ubuntu's apt GTK. The SONAME is read from the built .so, not hardcoded.
#
# Called by:
#   - release.yml (orchestrator on this `ci` branch), per target via matrix
#   - each fork branch's ci.yml stub (single target = validation build)
name: Build Broadway GTK .deb (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (fork branch, fork tag, or SHA)."
        required: true
        type: string
      gtk:
        description: "GTK base version, e.g. 4.14.5 (used in the .deb name + caches)."
        required: true
        type: string
      container:
        description: "Ubuntu image to build in, e.g. ubuntu:24.04 / ubuntu:26.04."
        required: true
        type: string
      demos:
        description: "Per-version demos meson flag: -Ddemos=false (4.14) / -Dbuild-demos=false (4.22+)."
        required: true
        type: string

permissions:
  contents: read

env:
  RUNTIME_PKGS: "libgtk-4-1, libgtk-4-bin"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04,     multiarch: x86_64-linux-gnu }
          - { arch: arm64, runner: ubuntu-24.04-arm, multiarch: aarch64-linux-gnu }
    runs-on: ${{ matrix.runner }}
    container: ${{ inputs.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ARCH: ${{ matrix.arch }}
      MULTIARCH: ${{ matrix.multiarch }}
      GTK_VERSION: ${{ inputs.gtk }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "1G"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ccache meson ninja-build pkg-config gettext python3 git ca-certificates zstd \
            libglib2.0-dev libglib2.0-dev-bin libgraphene-1.0-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libepoxy-dev libxkbcommon-dev libfribidi-dev libharfbuzz-dev \
            libjpeg-dev libpng-dev libtiff-dev libdrm-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ccache persists across runs so unchanged .c files relink without recompiling.
      # Keyed per (gtk, arch); the SHA suffix + prefix restore-keys give each run the
      # latest cache and save a new one.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.gtk }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.gtk }}-${{ matrix.arch }}-

      - name: Build (broadway-only)
        run: |
          ccache --zero-stats
          rm -rf _build
          # meson auto-detects ccache in PATH and uses it as the compiler launcher.
          # ${{ inputs.demos }} is per-version: -Ddemos (4.14) / -Dbuild-demos (4.22+).
          meson setup _build \
            -Dbroadway-backend=true \
            -Dx11-backend=false -Dwayland-backend=false -Dwin32-backend=false -Dmacos-backend=false \
            -Dvulkan=disabled -Dintrospection=disabled -Ddocumentation=false -Dman-pages=false \
            -Dbuild-testsuite=false -Dbuild-tests=false -Dbuild-examples=false ${{ inputs.demos }} \
            -Dmedia-gstreamer=disabled -Dprint-cups=disabled \
            -Dbuildtype=release
          ninja -C _build
          ccache --show-stats

      - name: Assemble .deb
        run: |
          # Revision: vN tag -> N (e.g. 123); otherwise the run number (rolling builds).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REV="${GITHUB_REF_NAME#v}"
          else
            REV="0+r${GITHUB_RUN_NUMBER}"
          fi
          DEB_VERSION="${GTK_VERSION}-${REV}"
          # SONAME read from the actual build output (e.g. libgtk-4.so.1.2200.2), so a
          # GTK version bump needs no edit here.
          SO_NAME="$(basename "$(find _build/gtk -maxdepth 1 -type f -name 'libgtk-4.so.1.*.*' | head -n1)")"
          test -n "${SO_NAME}"
          rm -rf pkgroot
          install -d pkgroot/DEBIAN "pkgroot/usr/lib/${MULTIARCH}" pkgroot/usr/bin
          install -m644 "_build/gtk/${SO_NAME}" "pkgroot/usr/lib/${MULTIARCH}/${SO_NAME}"
          ln -sf "${SO_NAME}" "pkgroot/usr/lib/${MULTIARCH}/libgtk-4.so.1"
          install -m755 _build/gdk/broadway/gtk4-broadwayd pkgroot/usr/bin/gtk4-broadwayd
          # Native triple-Shift debug-menu client; broadwayd spawns it by name via PATH
          # (BROADWAY_EVENT_MENU). Without it the menu silently fails to spawn.
          test -f _build/tools/gtk4-brotway-debugmenu
          install -m755 _build/tools/gtk4-brotway-debugmenu pkgroot/usr/bin/gtk4-brotway-debugmenu
          cat > pkgroot/DEBIAN/control <<EOF
          Package: gtk4-brotway
          Version: ${DEB_VERSION}
          Architecture: ${ARCH}
          Maintainer: Lev Gorodetskii <github@drsr.io>
          Section: libs
          Priority: optional
          Homepage: https://github.com/droserasprout/gtk-brotway
          Depends: ${RUNTIME_PKGS}
          Replaces: ${RUNTIME_PKGS}, gtk4-broadway-fork
          Conflicts: gtk4-broadway-fork
          Provides: gtk4-broadway-fork
          Description: GTK ${GTK_VERSION} Broadway backend (clipboard + touch fork)
           Patched libgtk-4 shared object plus the gtk4-broadwayd daemon for the
           Broadway backend, adding bi-directional clipboard and touch/Android input
           fixes and repointing the libgtk-4.so.1 SONAME link at them. Overlays
           libgtk-4-1 / libgtk-4-bin (Depends + Replaces), leaving the rest of apt's
           GTK (gir, common, ...) untouched.
          EOF
          printf '#!/bin/sh\nset -e\nldconfig\n' > pkgroot/DEBIAN/postinst
          chmod 755 pkgroot/DEBIAN/postinst
          # Stable, unversioned per-base name (the 'latest' release asset). The release
          # job derives the version-stamped name for vN tags.
          DEB_FILE="gtk4-brotway_${GTK_VERSION}_${ARCH}.deb"
          dpkg-deb --root-owner-group --build pkgroot "${DEB_FILE}"
          dpkg-deb --info "${DEB_FILE}"
          echo "DEB_FILE=${DEB_FILE}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ inputs.gtk }}-${{ matrix.arch }}
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
